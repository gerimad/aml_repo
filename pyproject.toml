[project]
name = "projectwork"
version = "0.1.0"
description = "Advanced machine learning project work on cryptocurrency markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aalpy>=1.6.2",
    "arch>=8.0.0",
    "hmmlearn>=0.3.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/scripts"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pypdf>=6.20.0",
    "pytest>=9.1.1",
]
